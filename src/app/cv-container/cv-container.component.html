<section class="main-container">
    <nav class="cv-actions no-print">
        <a class="cv-actions__pdf" [href]="cvData.meta.pdf.href" target="_blank" rel="noopener">{{cvData.meta.pdf.label}}</a>
    </nav>

    <app-top-bio [data]="cvData.header"></app-top-bio>
    <app-summary [data]="cvData.summary"></app-summary>
    <app-work-experience *ngFor="let section of cvData.sections" [data]="section"></app-work-experience>
    <app-skills [data]="cvData.skills"></app-skills>
    <app-general-info [data]="cvData.education"></app-general-info>
</section>
