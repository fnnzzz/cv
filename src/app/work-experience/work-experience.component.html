<section class="article-block">
    <h2 class="article-title">{{data.title}}</h2>

    <ul class="entries" [class.-compact]="data.compact">
        <li class="entry" *ngFor="let e of data.entries">
            <div class="entry__head">
                <span class="entry__name" [innerHTML]="e.name"></span>
                <span class="entry__dates">{{e.start}} - <ng-container *ngIf="e.end; else now">{{e.end}}</ng-container><ng-template #now>now</ng-template></span>
            </div>
            <p *ngIf="e.descr" class="entry__descr" [innerHTML]="e.descr"></p>
            <ul *ngIf="e.bullets?.length" class="entry__bullets">
                <li *ngFor="let b of e.bullets" [innerHTML]="b"></li>
            </ul>
            <ng-container *ngIf="e.stack">
                <p class="entry__stack print-only"><b>Stack:</b> {{e.stack}}</p>
                <ul class="chips -small screen-only">
                    <li class="chip" *ngFor="let t of stackTokens(e.stack)">{{t}}</li>
                </ul>
            </ng-container>
        </li>
    </ul>
</section>
