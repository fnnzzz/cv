<header class="top-bio__wrap">
    <div class="top-bio__photo-ring">
        <img class="top-bio__photo" src={{data.pic}} alt={{data.fullname}} />
    </div>

    <div class="top-bio__rightside">
        <p *ngIf="data.availability" class="top-bio__status no-print"><span class="top-bio__dot" aria-hidden="true"></span>{{data.availability}}</p>
        <h1 class="top-bio__fullname">{{data.fullname}}</h1>
        <p class="top-bio__title">{{data.title}}</p>
        <p class="top-bio__location">
            <svg class="top-bio__pin no-print" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 21s-7-5.5-7-11a7 7 0 0 1 14 0c0 5.5-7 11-7 11z" /><circle cx="12" cy="10" r="2.5" />
            </svg>{{data.location}}
        </p>

        <ul class="top-bio__links">
            <li *ngFor="let l of data.links" [class.print-only]="l.name === 'Web'">
                <a class="top-bio__link" href={{l.href}} [target]="l.targetBlank ? '_blank' : '_self'" rel="noopener">
                    <span class="top-bio__icon no-print" [ngSwitch]="l.name" aria-hidden="true">
                        <svg *ngSwitchCase="'LinkedIn'" viewBox="0 0 24 24" width="15" height="15" fill="currentColor"><path d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zM3 9.5h4V21H3zM9.5 9.5h3.8v1.6h.06c.53-1 1.83-2.06 3.77-2.06 4.03 0 4.77 2.65 4.77 6.1V21h-4v-5.1c0-1.22-.02-2.78-1.7-2.78-1.7 0-1.96 1.33-1.96 2.7V21h-4z" /></svg>
                        <svg *ngSwitchCase="'GitHub'" viewBox="0 0 24 24" width="15" height="15" fill="currentColor"><path d="M12 .5a11.5 11.5 0 0 0-3.64 22.41c.58.1.79-.25.79-.56v-2c-3.2.7-3.88-1.37-3.88-1.37-.53-1.33-1.28-1.69-1.28-1.69-1.05-.71.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.71 1.26 3.37.96.1-.75.4-1.26.73-1.55-2.56-.29-5.25-1.28-5.25-5.69 0-1.26.45-2.29 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.17 1.18a11 11 0 0 1 5.77 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.8 1.19 1.83 1.19 3.09 0 4.42-2.7 5.39-5.27 5.68.41.36.78 1.06.78 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .5z" /></svg>
                        <svg *ngSwitchCase="'Email'" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2" /><path d="m3 7 9 6 9-6" /></svg>
                        <svg *ngSwitchDefault viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9" /><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18" /></svg>
                    </span>
                    <span class="top-bio__link-name print-only">{{l.name}}:</span>
                    <span class="top-bio__link-val">{{l.val}}</span>
                    <span class="top-bio__link-short screen-only">{{l.name}}</span>
                </a>
            </li>
        </ul>
    </div>
</header>
