<section class="article-block">
    <h2 class="article-title">{{data.title}}</h2>

    <p class="article-descr" *ngFor="let line of data.lines" [innerHTML]="line"></p>

    <ul *ngIf="data.badges?.length" class="badges no-print">
        <li *ngFor="let badge of data.badges">
            <a class="article-badge" [href]="badge.url" target="_blank" rel="noopener">
                <img [src]="badge.pic" [alt]="badge.alt" [title]="badge.alt" />
            </a>
        </li>
    </ul>
</section>
